# Render Blueprint for the backend API (Render dashboard -> New -> Blueprint).
services:
  - type: web
    name: hackathon-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev because TypeScript and Prisma CLI are devDependencies
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE
        value: prisma
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the dashboard
      - key: CORS_ORIGIN
        sync: false # your Vercel URL, e.g. https://my-app.vercel.app
